[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[functions.lighthouse]
  timeout = 26

[functions.chat]
  timeout = 26

[[redirects]]
  from = "/api/lighthouse"
  to = "/.netlify/functions/lighthouse"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Canonical host: www → apex, keep the original path.
[[redirects]]
  from = "https://www.stellarweb.pt/*"
  to = "https://stellarweb.pt/:splat"
  status = 301
  force = true
